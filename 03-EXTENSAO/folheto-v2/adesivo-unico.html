<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Adesivo Bisnaga</title>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;600;700;800;900&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{
  width:531px;height:591px;
  overflow:hidden;
  font-family:'Montserrat',sans-serif;
  background:transparent;
}
.sticker{
  width:531px;height:591px;
  position:relative;
  overflow:hidden;
  border-radius:18px;
}
.sticker-bg{
  position:absolute;inset:0;
  background-image:url('img/sticker-bg.png');
  background-size:cover;
  background-position:center;
  z-index:0;
}
.sticker-content{
  position:relative;z-index:1;
  width:100%;height:100%;
  display:flex;flex-direction:column;
  align-items:center;
  padding:32px 24px 12px;
}
.sticker-title{
  font-size:28px;
  font-weight:900;
  color:#fff;
  text-align:center;
  line-height:1.15;
  text-shadow:0 2px 6px rgba(0,0,0,.4),0 0 20px rgba(0,0,0,.15);
  margin-bottom:6px;
}
.sticker-subtitle{
  font-size:14px;
  font-weight:700;
  color:rgba(255,255,255,.88);
  text-align:center;
  text-shadow:0 1px 4px rgba(0,0,0,.35);
  letter-spacing:.5px;
  margin-bottom:16px;
}
.sticker-product{
  background:rgba(255,255,255,.94);
  border-radius:12px;
  padding:10px 28px;
  text-align:center;
  box-shadow:0 2px 8px rgba(0,0,0,.18);
}
.product-name{
  font-size:30px;
  font-weight:900;
  color:#0097A7;
  line-height:1.15;
}
.product-detail{
  font-size:16px;
  font-weight:600;
  color:#555;
  margin-top:2px;
}
.sticker-footer{
  margin-top:auto;
  margin-bottom:120px;
  text-align:center;
}
.sticker-footer p{
  font-size:11px;
  font-weight:600;
  color:rgba(255,255,255,.75);
  text-shadow:0 1px 3px rgba(0,0,0,.35);
  line-height:1.35;
}
</style>
</head>
<body>
<div class="sticker">
  <div class="sticker-bg"></div>
  <div class="sticker-content">
    <p class="sticker-title">Conhecendo o<br>Mundo Micro</p>
    <p class="sticker-subtitle">Projeto de Extensão</p>
    <div class="sticker-product">
      <p class="product-name">Álcool em Gel</p>
      <p class="product-detail">70% &bull; Uso externo</p>
    </div>
    <div class="sticker-footer">
      <p>UNINASSAU &bull; COOPEB<br>Barreiras-BA &bull; 2026</p>
    </div>
  </div>
</div>
</body>
</html>
